name: Daily Threads post

on:
  schedule:
    # Target: 11:00 Toronto (15:00 UTC in summer EDT, 16:00 UTC in winter EST).
    # GitHub starts scheduled runs late, so the first run starts at 10:35 and
    # the script waits until 11:00. Later runs are backups. The script only
    # posts between 11:00 and 14:59 Toronto and never twice on the same day.
    # Both UTC offsets are scheduled so this works across the clock change.
    - cron: "35 14 * * *"
    - cron: "35 15 * * *"
    - cron: "35 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = verify token only; dry_run = pick and validate today's post; post = publish now"
        type: choice
        options: [check, dry_run, post]
        default: check

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.mode }}" in
              check)   python3 scripts/post_threads.py --check ;;
              dry_run) python3 scripts/post_threads.py --dry-run ;;
              post)    python3 scripts/post_threads.py --force ;;
            esac
          else
            python3 scripts/post_threads.py
          fi
      - name: Save post history
        run: |
          if ! git diff --quiet bloor-assets/state.json; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add bloor-assets/state.json
            git commit -m "Record today's post"
            git push
          fi
